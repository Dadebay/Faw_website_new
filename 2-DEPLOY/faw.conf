# /etc/nginx/sites-available/faw — FAW Trucks Turkmenistan (static site)
# Domain-ready: today it answers on the bare IP (default_server, server_name _).
# When a domain is bought, replace "server_name _;" with the domain names and run certbot.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;                      # later: fawtm.com www.fawtm.com

    root /var/www/faw;                  # symlink to the current release
    index index.html;
    charset utf-8;
    server_tokens off;

    # Security headers (no external origins are used by the site)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compression for text (images are already compressed JPEG/PNG, fonts are woff2)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml;   # text/html is always gzipped

    # Single page: model pages use #hash routes, so every path falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Always revalidate the page itself so updates show immediately
    location = /index.html {
        # add_header here replaces the server-level ones, so repeat them
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Long cache for images and fonts
    location ~* \.(?:jpg|jpeg|png|webp|svg|woff2)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
        try_files $uri =404;
    }

    # Never serve hidden files
    location ~ /\. {
        deny all;
    }
}
